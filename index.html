<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Context Loom – Public Pages</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#243745;background:#f5f7fa;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(100%,520px);border:1px solid #dce4eb;background:#fff;padding:28px;border-radius:8px}
h1{font-size:1.4rem;margin:0 0 14px}p{margin:0;line-height:1.6}#status{color:#405567}
.brand{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:#536d80;text-transform:uppercase;margin-bottom:20px}
.foot{color:#697987;font-size:.85rem;border-top:1px solid #e7edf2;margin-top:25px;padding-top:15px}
</style>
</head>
<body>
<main>
<span class="brand">Context Loom</span>
<h1>Freigabelink</h1>
<p id="status" role="status" aria-live="polite">Link wird geprüft …</p>
<p class="foot">Die Zielseiten liegen auf GitHub Pages und sind technisch öffentlich. Ein Freigabelink ersetzt keine Zugriffskontrolle.</p>
<noscript>Zum Öffnen des Links wird JavaScript benötigt.</noscript>
</main>
<script type="module" src="./router.mjs"></script>
</body>
</html>
