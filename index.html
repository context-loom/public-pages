<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Context Loom – Demo öffnen</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#243745;background:#f5f7fa;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(100%,500px);border:1px solid #dce4eb;background:#fff;padding:30px;border-radius:9px;box-shadow:0 4px 20px #1e34480a}
h1{font-size:1.5rem;margin:0 0 10px}p{margin:0;line-height:1.6;color:#4b5d6a}
.brand{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:#536d80;text-transform:uppercase;margin-bottom:19px}
label{display:block;font-weight:600;margin:20px 0 8px}
.entry{display:flex;gap:9px}
input{min-width:0;flex:1;padding:11px 12px;font:inherit;font-size:1rem;letter-spacing:.06em;border:1px solid #a8b9c7;border-radius:6px;text-transform:uppercase}
button{padding:10px 18px;border:1px solid #165b91;border-radius:6px;background:#165b91;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#104971}
button:disabled{cursor:wait;opacity:.55}
input:focus-visible,button:focus-visible{outline:3px solid #2e8ac3;outline-offset:2px}
#status{margin-top:14px;min-height:1.5em;font-size:.93rem;color:#405567}
.foot{color:#697987;font-size:.84rem;border-top:1px solid #e7edf2;margin-top:21px;padding-top:16px}
@media(max-width:430px){main{padding:23px}.entry{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<main>
<span class="brand">Context Loom</span>
<h1>Demo öffnen</h1>
<p>Gib den Code für die gewünschte Anwendung ein.</p>
<form id="access-form">
<label for="access-code">Code</label>
<div class="entry">
<input id="access-code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="24" placeholder="XXXX-XXXX-XXXX-XXXX" aria-describedby="code-help" required>
<button type="submit">Öffnen</button>
</div>
</form>
<p id="code-help" class="foot">Groß-/Kleinschreibung und Bindestriche spielen keine Rolle. Die Zieladresse wird im Browser entschlüsselt.</p>
<p id="status" role="status" aria-live="polite"></p>
<noscript>Zum Öffnen der Anwendung wird JavaScript benötigt.</noscript>
</main>
<script type="module" src="./router.mjs"></script>
</body>
</html>
