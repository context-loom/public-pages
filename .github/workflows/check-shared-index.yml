name: Check Shared Index

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "router.mjs"
      - "routes.json"
      - "scripts/create_shared_index.mjs"
      - "scripts/test_shared_index.mjs"
      - ".github/workflows/check-shared-index.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax prüfen
        run: |
          node --check router.mjs
          node --check scripts/create_shared_index.mjs
          node --check scripts/test_shared_index.mjs
      - name: Entschlüsselung und Pfade prüfen
        run: node scripts/test_shared_index.mjs
