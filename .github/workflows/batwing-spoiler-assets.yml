name: Build Batwing spoiler assets

on:
  push:
    branches: [main]
    paths:
      - "lego/batmobil/batwing_spoiler.scad"
      - "lego/batmobil/index.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batwing-spoiler-assets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public pages
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install OpenSCAD and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
      - name: Generate printable model and preview
        run: |
          set -eu
          src=lego/batmobil/batwing_spoiler.scad
          openscad -o lego/batmobil/batwing_spoiler.stl "$src"
          xvfb-run -a openscad \
            --camera=0,0,0,56,0,35,200 \
            --imgsize=1200,720 \
            --colorscheme=Tomorrow \
            -o lego/batmobil/batwing_spoiler.png "$src"
          test -s lego/batmobil/batwing_spoiler.stl
          test -s lego/batmobil/batwing_spoiler.png
      - name: Commit generated artifacts
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lego/batmobil/batwing_spoiler.stl lego/batmobil/batwing_spoiler.png
          if ! git diff --cached --quiet; then
            git commit -m "Build Batwing spoiler STL and preview"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
